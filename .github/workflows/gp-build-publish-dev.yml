name: Dev - Build and Publish Genome Properties API Image

on:
  workflow_dispatch:

env:
  REGISTRY: dockerhub.ebi.ac.uk
  IMAGE_NAMESPACE: microbiome-informatics/containers
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push-django-dev:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to EBI GitLab registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITLAB_CONTAINERS_USERNAME }}
          password: ${{ secrets.GITLAB_CONTAINERS_PASSWORD }}

      - name: Build the Django Docker image (Dev)
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/genome-properties-api:${{ env.IMAGE_TAG }} \
            --build-arg DJANGO_FORCE_SCRIPT_NAME=/genomeproperties/api \
            --build-arg DJANGO_STATIC_URL=/genomeproperties/api/static/ \
            -f ./Dockerfile .

      - name: Push the Django Docker image (Dev)
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/genome-properties-api:${{ env.IMAGE_TAG }}
