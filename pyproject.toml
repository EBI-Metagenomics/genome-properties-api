[project]
name = "genome-properties-api"
version = "0.1.0"
description = "Genome Properties API - Django-based GraphQL API"
requires-python = "==3.8.*"
dependencies = [
    "aniso8601==7.0.0",
    "asgiref==3.3.1",
    "Django==3.1.7",
    "django-cors-headers==3.7.0",
    "django-filter==2.4.0",
    "graphene==2.1.8",
    "graphene-django==2.15.0",
    "graphql-core==2.3.2",
    "graphql-relay==2.0.1",
    "gunicorn==20.0.4",
    "promise==2.3",
    "protobuf==3.15.5",
    "pytz==2021.1",
    "PyYAML>=5.3",
    "Rx==1.6.1",
    "singledispatch==3.6.1",
    "six==1.15.0",
    "sqlparse==0.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["genomeproperties", "web"]

[dependency-groups]
dev = []
